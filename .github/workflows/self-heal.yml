name: Self-heal

on:
  push:
  workflow_dispatch:
    inputs:
      repair:
        description: Repairs to run
        type: choice
        required: true
        default: all
        options:
          - all
          - package-lock
          - prettier
      commit:
        description: Commit repaired files
        type: boolean
        default: true

permissions:
  actions: write
  contents: write
  packages: read

concurrency:
  group: self-heal-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prettier:
    needs: package-lock
    if: ${{ always() && (needs.package-lock.result == 'success' || needs.package-lock.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.repair != 'package-lock') }}
    uses: moyarich/reusable-workflows/.github/workflows/reusable_self-heal-prettier.yml@main
    with:
      mode: fix
      prettier-config: this-repository
      commit: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
      node-version: "24"

  package-lock:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.repair != 'prettier' }}
    uses: moyarich/reusable-workflows/.github/workflows/reusable_self-heal_package-lock.yml@main
    with:
      mode: fix
      commit: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
      node-version: "24"
    secrets:
      package-token: ${{ secrets.GITHUB_TOKEN }}

  cli-dist:
    name: Heal generated plugin distribution
    needs: prettier
    if: ${{ always() && needs.prettier.result == 'success' }}
    uses: moyarich/reusable-workflows/.github/workflows/reusable_self-heal-dist.yml@main
    with:
      dist-path: packages/vite-github-actions/dist/
      build-command: npm run build
      install-command: npm ci --include=optional
      node-version: "24"
      node-caching: ""
      artifact-name: vite-github-actions-dist
      repair: true
      commit: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
      checkout-sha: ${{ github.ref_name }}
      target-branch: ${{ github.ref_name }}
    permissions:
      contents: write
